<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Государственные мероприятия — Silk Route Invest</title>
  <meta name="description" content="Система «одного окна» для государственных и международных мероприятий">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:      #0f1117; --bg2: #161b24; --bg3: #1e2535; --bg4: #252d3f;
      --sidebar: #111827; --card: #1a2035;
      --border:  rgba(255,255,255,0.08); --border2: rgba(255,255,255,0.14);
      --text:    #e8ecf4; --muted: #8b96b0; --muted2: #5a6580;
      --accent:  #3b82f6; --accent2: #60a5fa;
      --green:   #10b981; --red: #ef4444; --amber: #f59e0b;
      --teal:    #14b8a6; --purple: #8b5cf6;
      --r-sm: 6px; --r-md: 10px; --r-lg: 14px; --r-xl: 20px;
      --sw: 240px; --hh: 56px;
      --tr: 0.18s ease;
      --font: 'Inter', system-ui, sans-serif;
      --mono: 'JetBrains Mono', monospace;
      --sh-md: 0 4px 16px rgba(0,0,0,0.5);
      --sh-lg: 0 8px 32px rgba(0,0,0,0.6);
    }
    html,body{height:100%;overflow:hidden;}
    body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;}

    /* SCREENS */
    .screen{display:none;height:100vh;}
    .screen.active{display:flex;}

    /* LOGIN */
    #login-screen{
      align-items:center;justify-content:center;
      background:linear-gradient(135deg,#0a0e1a 0%,#0f1117 50%,#111827 100%);
      position:relative;overflow:hidden;
    }
    #login-screen::before{
      content:'';position:absolute;inset:0;
      background:radial-gradient(ellipse 80% 60% at 50% 0%,rgba(59,130,246,.12) 0%,transparent 70%),
                 radial-gradient(ellipse 60% 40% at 80% 100%,rgba(139,92,246,.08) 0%,transparent 70%);
    }
    .login-box{
      position:relative;width:440px;max-width:calc(100vw - 32px);
      background:var(--bg2);border:1px solid var(--border2);
      border-radius:var(--r-xl);padding:40px;box-shadow:var(--sh-lg);
    }
    .login-logo{display:flex;align-items:center;gap:12px;margin-bottom:28px;}
    .login-logo-icon{
      width:46px;height:46px;border-radius:12px;
      background:linear-gradient(135deg,#1d4ed8,#3b82f6);
      display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;
    }
    .login-logo-text h1{font-size:17px;font-weight:700;}
    .login-logo-text p{font-size:11px;color:var(--muted);margin-top:2px;}
    .form-g{margin-bottom:14px;}
    .form-g label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:5px;}
    .form-g input{
      width:100%;padding:10px 14px;background:var(--bg3);border:1px solid var(--border2);
      border-radius:var(--r-md);color:var(--text);font-size:14px;font-family:inherit;outline:none;
      transition:border-color var(--tr);
    }
    .form-g input:focus{border-color:var(--accent);}
    .btn-login{
      width:100%;padding:12px;background:linear-gradient(135deg,#1d4ed8,#3b82f6);
      border:none;border-radius:var(--r-md);color:#fff;font-size:15px;font-weight:600;
      cursor:pointer;margin-top:6px;transition:opacity var(--tr);font-family:inherit;
    }
    .btn-login:hover{opacity:.9;}
    .login-err{color:var(--red);font-size:13px;margin-top:8px;display:none;}
    .login-demo{margin-top:22px;padding-top:18px;border-top:1px solid var(--border);}
    .login-demo p{font-size:11px;color:var(--muted);margin-bottom:8px;}
    .demo-btns{display:flex;flex-wrap:wrap;gap:6px;}
    .demo-btn{
      padding:5px 10px;background:var(--bg3);border:1px solid var(--border2);
      border-radius:var(--r-sm);color:var(--muted);font-size:11px;cursor:pointer;
      transition:all var(--tr);font-family:inherit;
    }
    .demo-btn:hover{border-color:var(--accent);color:var(--accent2);}

    /* APP */
    #app-screen{flex-direction:row;overflow:hidden;}

    /* SIDEBAR */
    .ev-sidebar{
      width:var(--sw);background:var(--sidebar);border-right:1px solid var(--border);
      display:flex;flex-direction:column;flex-shrink:0;z-index:100;overflow:hidden;
    }
    .sb-head{
      height:var(--hh);padding:0 14px;display:flex;align-items:center;gap:10px;
      border-bottom:1px solid var(--border);flex-shrink:0;
    }
    .sb-logo-icon{
      width:32px;height:32px;border-radius:8px;
      background:linear-gradient(135deg,#1d4ed8,#3b82f6);
      display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;
    }
    .sb-logo-text{font-size:12px;font-weight:700;line-height:1.3;}
    .sb-logo-sub{font-size:10px;color:var(--muted);font-weight:400;}
    .ev-sel-wrap{margin:10px 8px;flex-shrink:0;}
    .ev-sel-wrap select{
      width:100%;padding:6px 8px;background:var(--bg3);border:1px solid var(--border2);
      border-radius:var(--r-sm);color:var(--text);font-size:11px;font-family:inherit;outline:none;cursor:pointer;
    }
    .ev-sel-wrap select option{background:var(--bg2);}
    .sb-nav{flex:1;overflow-y:auto;padding:4px 6px 8px;scrollbar-width:thin;scrollbar-color:var(--bg4) transparent;}
    .nav-sec-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted2);padding:10px 8px 3px;}
    .nav-item{
      display:flex;align-items:center;gap:9px;padding:7px 10px;
      border-radius:var(--r-sm);cursor:pointer;transition:all var(--tr);
      color:var(--muted);font-size:12.5px;font-weight:500;position:relative;white-space:nowrap;
    }
    .nav-item:hover{background:var(--bg3);color:var(--text);}
    .nav-item.active{background:rgba(59,130,246,.12);color:var(--accent2);}
    .nav-item.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:18px;background:var(--accent);border-radius:0 2px 2px 0;}
    .nav-icon{width:18px;text-align:center;font-size:14px;flex-shrink:0;}
    .nav-badge{margin-left:auto;min-width:17px;height:17px;padding:0 4px;background:var(--red);border-radius:9px;font-size:10px;font-weight:700;color:#fff;display:flex;align-items:center;justify-content:center;}
    .nav-badge.am{background:var(--amber);color:#111;}
    .sb-foot{border-top:1px solid var(--border);padding:8px 6px;flex-shrink:0;}
    .u-info{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:var(--r-sm);}
    .u-avatar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0;background:var(--accent);}
    .u-name{font-size:12px;font-weight:600;}
    .u-role{font-size:10px;color:var(--muted);}
    .btn-logout{margin-left:auto;padding:4px 7px;background:transparent;border:1px solid var(--border2);border-radius:var(--r-sm);color:var(--muted);font-size:11px;cursor:pointer;transition:all var(--tr);font-family:inherit;}
    .btn-logout:hover{border-color:var(--red);color:var(--red);}

    /* MAIN */
    .ev-main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
    .ev-header{height:var(--hh);background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 18px;gap:10px;flex-shrink:0;}
    .hdr-title{font-size:15px;font-weight:700;flex:1;}
    .btn-icon{width:32px;height:32px;display:flex;align-items:center;justify-content:center;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r-sm);cursor:pointer;font-size:15px;transition:all var(--tr);color:var(--muted);position:relative;text-decoration:none;}
    .btn-icon:hover{background:var(--bg4);color:var(--text);}
    .n-dot{position:absolute;top:4px;right:4px;width:7px;height:7px;background:var(--red);border-radius:50%;border:2px solid var(--bg2);}
    .lang-sw{display:flex;gap:3px;}
    .lang-btn{padding:3px 7px;background:transparent;border:1px solid var(--border);border-radius:var(--r-sm);color:var(--muted);font-size:11px;font-weight:700;cursor:pointer;transition:all var(--tr);text-transform:uppercase;font-family:inherit;}
    .lang-btn:hover,.lang-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
    .ev-content{flex:1;overflow-y:auto;padding:18px;scrollbar-width:thin;scrollbar-color:var(--bg4) transparent;}

    /* COMPONENTS */
    .kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-bottom:18px;}
    .kpi-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px;position:relative;overflow:hidden;}
    .kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--acc,var(--accent));}
    .kpi-val{font-size:30px;font-weight:800;line-height:1;}
    .kpi-lbl{font-size:12px;color:var(--muted);margin-top:3px;}
    .kpi-sub{font-size:11px;color:var(--muted2);margin-top:1px;}
    .kpi-ico{position:absolute;right:12px;top:12px;font-size:22px;opacity:.25;}

    .sec-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
    .sec-title{font-size:14px;font-weight:700;}
    .sec-acts{margin-left:auto;display:flex;gap:6px;}

    .toolbar{display:flex;align-items:center;gap:7px;margin-bottom:12px;flex-wrap:wrap;}
    .search-inp{flex:1;min-width:160px;padding:7px 11px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r-sm);color:var(--text);font-size:13px;font-family:inherit;outline:none;}
    .search-inp:focus{border-color:var(--accent);}
    .f-sel{padding:7px 9px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r-sm);color:var(--text);font-size:12px;font-family:inherit;outline:none;cursor:pointer;}
    .f-sel option{background:var(--bg2);}

    .btn{padding:7px 13px;border-radius:var(--r-sm);font-size:12.5px;font-weight:600;cursor:pointer;border:none;font-family:inherit;transition:all var(--tr);display:inline-flex;align-items:center;gap:5px;}
    .btn-primary{background:var(--accent);color:#fff;}
    .btn-primary:hover{background:#2563eb;}
    .btn-secondary{background:var(--bg3);color:var(--text);border:1px solid var(--border2);}
    .btn-secondary:hover{background:var(--bg4);}
    .btn-danger{background:rgba(239,68,68,.12);color:var(--red);border:1px solid rgba(239,68,68,.3);}
    .btn-success{background:rgba(16,185,129,.12);color:var(--green);border:1px solid rgba(16,185,129,.3);}
    .btn-sm{padding:5px 9px;font-size:11.5px;}
    .btn-xs{padding:3px 7px;font-size:11px;}

    .badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;}
    .bg-gray{background:rgba(139,150,176,.15);color:var(--muted);}
    .bg-blue{background:rgba(59,130,246,.18);color:#93c5fd;}
    .bg-green{background:rgba(16,185,129,.18);color:#6ee7b7;}
    .bg-amber{background:rgba(245,158,11,.18);color:#fcd34d;}
    .bg-red{background:rgba(239,68,68,.18);color:#fca5a5;}
    .bg-teal{background:rgba(20,184,166,.18);color:#5eead4;}
    .bg-purple{background:rgba(139,92,246,.18);color:#c4b5fd;}
    .bg-gold{background:rgba(245,158,11,.25);color:#fbbf24;}
    .bg-dark{background:rgba(255,255,255,.07);color:var(--muted);}

    .tbl-wrap{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;overflow-x:auto;}
    .ev-tbl{width:100%;border-collapse:collapse;min-width:600px;}
    .ev-tbl th{padding:9px 13px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-bottom:1px solid var(--border);background:var(--bg3);text-align:left;white-space:nowrap;}
    .ev-tbl td{padding:10px 13px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle;}
    .ev-tbl tr:last-child td{border-bottom:none;}
    .ev-tbl tr:hover td{background:rgba(255,255,255,.02);}
    .td-acts{display:flex;gap:5px;}

    .empty-s{padding:44px;text-align:center;color:var(--muted);}
    .empty-ico{font-size:36px;margin-bottom:10px;opacity:.45;}
    .empty-txt{font-size:14px;}
    .empty-sub{font-size:11px;margin-top:3px;color:var(--muted2);}

    /* MODAL */
    .modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;pointer-events:none;transition:opacity var(--tr);}
    .modal-ov.open{opacity:1;pointer-events:all;}
    .modal-box{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r-xl);width:100%;max-width:600px;max-height:90vh;display:flex;flex-direction:column;box-shadow:var(--sh-lg);transform:translateY(18px);transition:transform var(--tr);}
    .modal-ov.open .modal-box{transform:translateY(0);}
    .modal-lg{max-width:780px;}
    .modal-hdr{padding:18px 22px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0;}
    .modal-ttl{font-size:15px;font-weight:700;flex:1;}
    .modal-close{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border:none;background:var(--bg3);border-radius:50%;cursor:pointer;font-size:15px;color:var(--muted);transition:all var(--tr);}
    .modal-close:hover{background:var(--bg4);color:var(--text);}
    .modal-body{padding:18px 22px;overflow-y:auto;flex:1;}
    .modal-foot{padding:14px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:7px;flex-shrink:0;}

    /* FORM */
    .f-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;}
    .f-row.s1{grid-template-columns:1fr;}
    .f-row.s3{grid-template-columns:1fr 1fr 1fr;}
    .f-grp{display:flex;flex-direction:column;gap:4px;}
    .f-lbl{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;}
    .f-lbl .req{color:var(--red);margin-left:2px;}
    .f-inp,.f-sel2,.f-ta{padding:8px 11px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r-sm);color:var(--text);font-size:13px;font-family:inherit;outline:none;transition:border-color var(--tr);}
    .f-inp:focus,.f-sel2:focus,.f-ta:focus{border-color:var(--accent);}
    .f-sel2 option{background:var(--bg2);}
    .f-ta{resize:vertical;min-height:66px;}

    /* CARDS GRID */
    .ev-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px;}
    .ev-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px;cursor:pointer;transition:all var(--tr);}
    .ev-card:hover{border-color:var(--border2);box-shadow:var(--sh-md);transform:translateY(-1px);}
    .card-hd{display:flex;align-items:flex-start;gap:9px;margin-bottom:9px;}
    .card-ico{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
    .card-ttl{font-size:13px;font-weight:600;line-height:1.3;}
    .card-sub{font-size:11px;color:var(--muted);margin-top:1px;}
    .card-meta{display:flex;gap:7px;flex-wrap:wrap;align-items:center;}
    .card-stat{font-size:11px;color:var(--muted);}
    .card-acts{margin-top:10px;padding-top:9px;border-top:1px solid var(--border);display:flex;gap:5px;}

    /* ACTIVITY */
    .act-list{display:flex;flex-direction:column;}
    .act-item{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);}
    .act-item:last-child{border-bottom:none;}
    .act-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);margin-top:5px;flex-shrink:0;}
    .act-dot.red{background:var(--red);}
    .act-dot.green{background:var(--green);}
    .act-dot.am{background:var(--amber);}
    .act-dot.mu{background:var(--muted2);}
    .act-body{flex:1;min-width:0;}
    .act-text{font-size:13px;}
    .act-meta{font-size:11px;color:var(--muted);margin-top:1px;}

    /* LAYOUT */
    .two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}
    .three-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:14px;}
    .sec-box{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);}
    .sec-box-hd{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:7px;}
    .sec-box-hd .sec-title{font-size:12.5px;}
    .sec-box-bd{padding:10px 14px;}

    .dl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;}
    .dl-lbl{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted2);margin-bottom:2px;}
    .dl-val{font-size:13px;}

    /* PROGRESS */
    .prog-bar{height:5px;background:var(--bg3);border-radius:3px;overflow:hidden;}
    .prog-fill{height:100%;background:var(--accent);border-radius:3px;transition:width .5s;}

    /* TAGS */
    .tag-list{display:flex;gap:3px;flex-wrap:wrap;}
    .tag{padding:1px 7px;background:var(--bg3);border:1px solid var(--border2);border-radius:20px;font-size:10.5px;color:var(--muted);}

    /* AVATAR */
    .g-av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;flex-shrink:0;}

    /* NOTIF PANEL */
    .notif-panel{position:fixed;right:14px;top:calc(var(--hh) + 6px);width:320px;max-height:68vh;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r-lg);box-shadow:var(--sh-lg);z-index:500;overflow:hidden;display:none;flex-direction:column;}
    .notif-panel.open{display:flex;}
    .notif-hdr{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;}
    .notif-ttl{font-size:12px;font-weight:700;flex:1;}
    .notif-list{overflow-y:auto;flex:1;}
    .n-item{padding:10px 14px;border-bottom:1px solid var(--border);cursor:pointer;transition:background var(--tr);}
    .n-item:hover{background:var(--bg3);}
    .n-item.unread{border-left:3px solid var(--accent);}
    .n-item.hi{border-left-color:var(--red);}
    .n-text{font-size:12.5px;}
    .n-meta{font-size:10.5px;color:var(--muted);margin-top:2px;}

    /* TOAST */
    .toast-wrap{position:fixed;bottom:16px;right:16px;display:flex;flex-direction:column;gap:7px;z-index:2000;pointer-events:none;}
    .toast{padding:10px 14px;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r-md);box-shadow:var(--sh-md);font-size:13px;animation:tIn .22s ease;max-width:280px;pointer-events:all;}
    .toast.ok{border-left:3px solid var(--green);}
    .toast.er{border-left:3px solid var(--red);}
    .toast.inf{border-left:3px solid var(--accent);}
    @keyframes tIn{from{transform:translateX(16px);opacity:0;}to{transform:none;opacity:1;}}

    /* SPINNER */
    .spin{display:inline-block;width:18px;height:18px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;}
    @keyframes sp{to{transform:rotate(360deg);}}

    /* CALENDAR */
    .cal-mini{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:12px;}
    .cal-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
    .cal-mon{font-size:12.5px;font-weight:700;}
    .cal-nav-btn{width:24px;height:24px;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);border-radius:5px;cursor:pointer;color:var(--muted);font-size:13px;background:var(--bg3);transition:all var(--tr);}
    .cal-nav-btn:hover{border-color:var(--accent);color:var(--accent2);}
    .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;}
    .cal-dow{font-size:9.5px;font-weight:700;color:var(--muted2);text-transform:uppercase;padding:3px 0;}
    .cal-day{font-size:11px;padding:4px 2px;border-radius:4px;cursor:pointer;color:var(--muted);transition:all var(--tr);}
    .cal-day:hover{background:var(--bg3);color:var(--text);}
    .cal-day.today{background:rgba(59,130,246,.2);color:var(--accent2);font-weight:700;}
    .cal-day.has-ev{color:var(--text);font-weight:600;}
    .cal-day.has-ev::after{content:'';display:block;width:3px;height:3px;background:var(--accent);border-radius:50%;margin:1px auto 0;}
    .cal-day.oth{opacity:.25;}

    /* MAP */
    .map-ph{height:360px;background:var(--bg3);border-radius:var(--r-lg);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);gap:8px;}

    /* UTIL */
    .mu{color:var(--muted);}
    .xs{font-size:11px;}
    .sm{font-size:12px;}
    .fw7{font-weight:700;}
    .mt2{margin-top:8px;}
    .mt3{margin-top:12px;}
    .mb3{margin-bottom:12px;}
    .mono{font-family:var(--mono);}
    .hidden{display:none!important;}
    .tr-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:12px;}
    .g-mini{display:flex;align-items:center;gap:8px;padding:7px;border-radius:var(--r-sm);background:var(--bg3);}
    .menu-toggle{display:none;}
    .sb-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:199;display:none;}
    .sb-overlay.open{display:block;}

    @media(max-width:768px){
      :root{--sw:0px;}
      .ev-sidebar{position:fixed;left:0;top:0;bottom:0;width:260px;transform:translateX(-100%);transition:transform .25s;z-index:200;}
      .ev-sidebar.mob{transform:translateX(0);}
      .menu-toggle{display:flex;}
      .f-row{grid-template-columns:1fr;}
      .two-col{grid-template-columns:1fr;}
      .three-col{grid-template-columns:1fr;}
      .kpi-grid{grid-template-columns:repeat(2,1fr);}
    }
    ::-webkit-scrollbar{width:5px;height:5px;}
    ::-webkit-scrollbar-track{background:transparent;}
    ::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:3px;}
  </style>
</head>

<script>
(function(){
'use strict';
const EV=window.EV, U=EV.U, C=EV.C;
const t=(k,p)=>EV.I18n.t(k,p)||k;

/* ─── STATE ───────────────────────────────────────────────── */
const S={user:null, mod:null, evId:null, dir:{}};
window.S=S;

/* ─── COLORS ──────────────────────────────────────────────── */
const AV_COLORS=['#3b82f6','#8b5cf6','#10b981','#f59e0b','#ef4444','#14b8a6'];
const avColor=n=>AV_COLORS[U.hash(n||'')%AV_COLORS.length];

/* ─── AUTH ────────────────────────────────────────────────── */
EV.Auth={
  login(email,pw){
    const u=EV.Data.__db().tables.users.find(x=>x.email===email&&x.password===pw);
    if(!u) return false;
    S.user=u;
    try{sessionStorage.setItem(C.SESSION_KEY,JSON.stringify({id:u.id}));}catch(e){}
    return true;
  },
  restore(){
    try{
      const s=sessionStorage.getItem(C.SESSION_KEY);
      if(!s) return false;
      const {id}=JSON.parse(s);
      const u=EV.Data.__db().tables.users.find(x=>x.id===id);
      if(u){S.user=u;return true;}
    }catch(e){}
    return false;
  },
  current(){return S.user||null;},
  logout(){S.user=null;try{sessionStorage.removeItem(C.SESSION_KEY);}catch(e){}}
};

/* ─── TOAST ───────────────────────────────────────────────── */
const Toast={
  show(msg,type,ms=3200){
    const el=document.createElement('div');
    el.className='toast '+type;el.textContent=msg;
    document.getElementById('toasts').appendChild(el);
    setTimeout(()=>el.remove(),ms);
  },
  ok(m){this.show(m,'ok');},
  err(m){this.show(m,'er');},
  info(m){this.show(m,'inf');}
};
window.Toast=Toast;

/* ─── MODAL ───────────────────────────────────────────────── */
const Modal={
  init(){
    const ov=document.getElementById('modal-ov');
    document.getElementById('modal-cls').onclick=()=>this.close();
    ov.addEventListener('click',e=>{if(e.target===ov)this.close();});
  },
  open({title,body,footer,wide}){
    document.getElementById('modal-ttl').textContent=title||'';
    document.getElementById('modal-body').innerHTML=body||'';
    document.getElementById('modal-foot').innerHTML=footer||'';
    document.getElementById('modal-box').className='modal-box'+(wide?' modal-lg':'');
    document.getElementById('modal-ov').classList.add('open');
    const f=document.querySelector('#modal-box input,#modal-box select,#modal-box textarea');
    if(f) setTimeout(()=>f.focus(),60);
  },
  close(){document.getElementById('modal-ov').classList.remove('open');},
  setFoot(h){document.getElementById('modal-foot').innerHTML=h;}
};
window.Modal=Modal;

/* ─── HELPERS ─────────────────────────────────────────────── */
function e(s){return U.esc(s);}
function bd(text,cls){return`<span class="badge ${cls||'bg-gray'}">${e(text)}</span>`;}
const COLOR_MAP={
  event:{planned:'bg-dark',preparation:'bg-blue',booking:'bg-amber',arriving:'bg-teal',running:'bg-green',completed:'bg-dark',archive:'bg-dark'},
  guest:{expected:'bg-blue',arrived:'bg-teal',accommodated:'bg-green',departed:'bg-dark'},
  booking:{draft:'bg-dark',sent:'bg-amber',confirmed:'bg-green',changed:'bg-amber',cancelled:'bg-red'},
  meeting:{planned:'bg-dark',driver_assigned:'bg-amber',confirmed:'bg-blue',met:'bg-teal',done:'bg-green'},
  transfer:{planned:'bg-dark',assigned:'bg-amber',dispatched:'bg-blue',enroute:'bg-teal',done:'bg-green',cancelled:'bg-red'},
  departure:{planned:'bg-dark',vehicle_assigned:'bg-amber',enroute:'bg-blue',departed:'bg-green'},
  task:{new:'bg-dark',in_progress:'bg-amber',done:'bg-green',overdue:'bg-red'},
  meal:{draft:'bg-dark',requested:'bg-amber',confirmed:'bg-green',served:'bg-teal',cancelled:'bg-red'},
  excursion:{planned:'bg-dark',confirmed:'bg-blue',running:'bg-teal',done:'bg-green',cancelled:'bg-red'},
};
function stBd(entity,status){
  const cls=(COLOR_MAP[entity]||{})[status]||'bg-gray';
  const pfx={event:'ev',guest:'gs',booking:'bk',meeting:'mt',transfer:'tr',departure:'dp',task:'tk',meal:'ml',excursion:'ex'}[entity]||entity.slice(0,2);
  const lbl=t(`${pfx}.status.${status}`)||status;
  return bd(lbl,cls);
}
function vipBd(v){
  if(!v||v==='none') return '';
  return bd(v==='vip'?'VIP':'Протокол',v==='vip'?'bg-gold':'bg-purple');
}
function prioBd(p){
  return bd(t('prio.'+p)||p,{low:'bg-gray',normal:'bg-blue',high:'bg-amber',critical:'bg-red'}[p]||'bg-gray');
}
function av(name,sz){
  const c=avColor(name),i=U.initials(name),s=sz||28;
  return`<div class="g-av" style="width:${s}px;height:${s}px;background:${c}">${e(i)}</div>`;
}
function flag(cc){return U.flag(cc||'');}
function roomLbl(rt){return t('room.'+rt)||rt;}
function mealLbl(m){return t('meal.'+m)||m;}
function vehLbl(c){return t('veh.'+c)||c;}
function dietLbl(d){return t('diet.'+d)||d;}

/* ─── EVENT SELECTOR ──────────────────────────────────────── */
async function loadEvSel(){
  const evs=await EV.Data.list('events');
  const sel=document.getElementById('ev-sel');
  sel.innerHTML='<option value="">— Все мероприятия —</option>';
  evs.sort((a,b)=>(b.dateFrom||'').localeCompare(a.dateFrom||'')).forEach(ev=>{
    const o=document.createElement('option');
    o.value=ev.id; o.textContent=U.tx(ev.name);
    if(S.evId===ev.id) o.selected=true;
    sel.appendChild(o);
  });
}

/* ─── NAVIGATION ──────────────────────────────────────────── */
function buildNav(){
  const nav=document.getElementById('sb-nav');
  const allowed=EV.Perm.allowedModules(S.user);
  const secs=[
    {lbl:'Рабочее место',mods:['my','dashboard']},
    {lbl:'Программа',mods:['events','guests','booking','accommodation','meeting','transport']},
    {lbl:'Логистика',mods:['routes','excursions','escort','meals','vip','departure']},
    {lbl:'Управление',mods:['tasks','calendar','map','reports','archive']},
    {lbl:'Система',mods:['quality','security']},
  ];
  nav.innerHTML=secs.map(sec=>{
    const its=sec.mods.filter(id=>allowed.find(m=>m.id===id));
    if(!its.length) return '';
    return`<div><div class="nav-sec-lbl">${e(sec.lbl)}</div>
    ${its.map(id=>{
      const mod=C.MODULES.find(m=>m.id===id);
      if(!mod) return '';
      return`<div class="nav-item${S.mod===id?' active':''}" data-m="${id}">
        <span class="nav-icon">${mod.icon}</span>
        <span>${t('nav.'+id)||id}</span>
      </div>`;
    }).join('')}</div>`;
  }).join('');
  nav.querySelectorAll('.nav-item').forEach(el=>{
    el.addEventListener('click',()=>go(el.dataset.m));
  });
}

/* ─── GO (NAVIGATE) ───────────────────────────────────────── */
async function go(mod){
  if(!EV.Perm.canView(mod)) return;
  S.mod=mod;
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.toggle('active',el.dataset.m===mod));
  document.getElementById('sidebar').classList.remove('mob');
  document.getElementById('sb-overlay').classList.remove('open');
  document.getElementById('page-title').textContent=t('nav.'+mod)||mod;
  const cnt=document.getElementById('ev-content');
  cnt.innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:180px"><div class="spin"></div></div>';
  try{
    S.dir=EV.Data.directory();
    const html=await(MOD[mod]?.render?.())||placeholder(mod);
    cnt.innerHTML=html;
    MOD[mod]?.init?.();
  }catch(ex){
    console.error(ex);
    cnt.innerHTML=`<div class="empty-s"><div class="empty-ico">⚠️</div><div class="empty-txt">${e(ex.message||'Ошибка')}</div></div>`;
  }
}
window.go=go;

function placeholder(id){
  const mod=C.MODULES.find(m=>m.id===id);
  return`<div style="text-align:center;padding:60px"><div style="font-size:46px;margin-bottom:10px">${mod?.icon||'📄'}</div>
  <div style="font-size:17px;font-weight:700">${t('nav.'+id)||id}</div>
  <div class="mu" style="margin-top:6px">Модуль в разработке</div></div>`;
}

/* ═══════════════════════════════════════════════════════════
   MODULES
   ═══════════════════════════════════════════════════════════ */
const MOD={};

/* ── DASHBOARD ───────────────────────────────────────────── */
MOD.dashboard={
  async render(){
    const evId=S.evId;
    const f=evId?{eventId:evId}:{};
    const [evs,guests,tasks,bks,meets,deps,audit]=await Promise.all([
      EV.Data.list('events'),
      EV.Data.list('guests',f),
      EV.Data.list('tasks',f),
      EV.Data.list('bookings',f),
      EV.Data.list('meetings',f),
      EV.Data.list('departures',f),
      EV.Perm.can('audit.view')?EV.Data.list('audit'):Promise.resolve([]),
    ]);
    const now=new Date(), today=U.toDay(now);
    const active=evs.filter(ev=>['planned','preparation','booking','arriving','running'].includes(ev.status));
    const overdue=tasks.filter(tk=>tk.status!=='done'&&tk.due&&U.parse(tk.due)<now);
    const unconf=bks.filter(b=>b.status==='draft'||b.status==='sent');
    const todayArr=guests.filter(g=>g.arrivalAt&&U.day(g.arrivalAt)===today&&g.status==='expected');
    const todayDep=deps.filter(d=>d.at&&U.day(d.at)===today);
    const todayMeet=meets.filter(m=>m.at&&U.day(m.at)===today).sort((a,b)=>(a.at||'').localeCompare(b.at||''));
    const urgent=tasks.filter(tk=>tk.status!=='done'&&['high','critical'].includes(tk.priority)).slice(0,6);
    const recent=(audit||[]).slice(-8).reverse();

    const kpi=[
      {v:active.length,l:'Активных мер-й',s:`всего ${evs.length}`,ico:'🗂',acc:'#3b82f6'},
      {v:guests.length,l:'Гостей',s:`${todayArr.length} прибывает сегодня`,ico:'👥',acc:'#8b5cf6'},
      {v:tasks.filter(t=>t.status!=='done').length,l:'Задач открыто',s:`${overdue.length} просрочено`,ico:'✅',acc:overdue.length?'#ef4444':'#10b981'},
      {v:bks.length,l:'Броней',s:`${unconf.length} ожидают`,ico:'🏨',acc:'#f59e0b'},
      {v:meets.filter(m=>['planned','driver_assigned'].includes(m.status)).length,l:'Встреч',s:`${todayMeet.length} сегодня`,ico:'🛬',acc:'#14b8a6'},
      {v:deps.filter(d=>d.status!=='departed').length,l:'Проводов',s:`${todayDep.length} сегодня`,ico:'🛫',acc:'#60a5fa'},
    ];

    const renderKpi=kpi.map(k=>`<div class="kpi-card" style="--acc:${k.acc}">
      <div class="kpi-ico">${k.ico}</div>
      <div class="kpi-val">${k.v}</div>
      <div class="kpi-lbl">${k.l}</div>
      <div class="kpi-sub">${k.s}</div>
    </div>`).join('');

    const renderSchedule=[
      ...todayMeet.map(m=>{
        const g=EV.Data.__db().tables.guests.find(x=>x.id===m.guestId);
        return`<div class="act-item">
          <div class="act-dot" style="background:#14b8a6"></div>
          <div class="act-body">
            <div class="act-text">🛬 ${e(g?.fullName||m.guestId)} — ${e(m.flightNo||'—')}</div>
            <div class="act-meta">${U.fmtTime(m.at)}</div>
          </div>${stBd('meeting',m.status)}</div>`;
      }),
      ...todayDep.map(d=>{
        const g=EV.Data.__db().tables.guests.find(x=>x.id===d.guestId);
        return`<div class="act-item">
          <div class="act-dot am"></div>
          <div class="act-body">
            <div class="act-text">🛫 ${e(g?.fullName||d.guestId)} — ${e(d.flightNo||'—')}</div>
            <div class="act-meta">${U.fmtTime(d.at)}</div>
          </div>${stBd('departure',d.status)}</div>`;
      })
    ].join('');

    const renderUrgent=urgent.map(tk=>{
      const u=S.dir.users?.[tk.assigneeId];
      const title=tk.title||t(tk.titleKey||'')||tk.id;
      return`<div class="act-item">
        <div class="act-dot ${tk.priority==='critical'?'red':'am'}"></div>
        <div class="act-body">
          <div class="act-text">${e(title)}</div>
          <div class="act-meta">${u?e(u.name):''}${tk.due?' · '+U.fmtDTFull(tk.due):''}</div>
        </div>${prioBd(tk.priority)}</div>`;
    }).join('');

    const renderActive=active.slice(0,4).map(ev=>renderEvCard(ev)).join('');
    const renderAudit=recent.map(a=>`<div class="act-item">
      <div class="act-dot ${a.action==='delete'?'red':a.action==='create'?'green':'mu'}"></div>
      <div class="act-body">
        <div class="act-text">${t('audit.'+a.action)||a.action} · ${e(a.label||a.entityId)}</div>
        <div class="act-meta">${e(a.userName)} · ${U.fmtDTFull(a.ts)}</div>
      </div></div>`).join('');

    return`<div class="kpi-grid">${renderKpi}</div>
    <div class="two-col">
      <div class="sec-box">
        <div class="sec-box-hd"><span>📅</span><span class="sec-title">Сегодня</span><span class="xs mu" style="margin-left:auto">${U.fmtDate(U.nowISO())}</span></div>
        <div class="sec-box-bd"><div class="act-list">${renderSchedule||'<div class="empty-s" style="padding:16px"><div class="empty-ico" style="font-size:22px">😌</div><div class="empty-txt">Нет событий</div></div>'}</div></div>
      </div>
      <div class="sec-box">
        <div class="sec-box-hd"><span>⚡</span><span class="sec-title">Срочные задачи</span>${EV.Perm.canView('tasks')?`<button class="btn btn-xs btn-secondary" style="margin-left:auto" onclick="go('tasks')">Все →</button>`:''}
        </div>
        <div class="sec-box-bd"><div class="act-list">${renderUrgent||'<div class="empty-s" style="padding:16px"><div class="empty-ico" style="font-size:22px">✅</div><div class="empty-txt">Срочных нет</div></div>'}</div></div>
      </div>
    </div>
    ${EV.Perm.canView('events')?`
    <div class="sec-head"><span class="sec-title">Активные мероприятия</span><div class="sec-acts"><button class="btn btn-sm btn-secondary" onclick="go('events')">Все →</button></div></div>
    <div class="ev-cards" id="dash-ev-cards">${active.length?renderActive:'<div class="empty-s"><div class="empty-ico">🗂</div><div class="empty-txt">Нет</div></div>'}</div>`:''}
    ${EV.Perm.can('audit.view')&&recent.length?`
    <div class="sec-head" style="margin-top:18px"><span class="sec-title">Последние действия</span></div>
    <div class="sec-box"><div class="sec-box-bd"><div class="act-list">${renderAudit}</div></div></div>`:''}`;
  },
  init(){
    document.querySelectorAll('#dash-ev-cards .ev-card[data-eid]').forEach(el=>{
      el.addEventListener('click',e2=>{if(!e2.target.closest('button'))showEvDetail(el.dataset.eid);});
    });
  }
};

/* ── EVENTS ──────────────────────────────────────────────── */
MOD.events={
  async render(){
    const evs=await EV.Data.list('events');
    return`<div class="sec-head"><span class="sec-title">Мероприятия</span>
      <div class="sec-acts">${EV.Perm.can('event.create')?`<button class="btn btn-primary btn-sm" id="ev-create-btn">+ Создать</button>`:''}</div></div>
    <div class="toolbar">
      <input class="search-inp" id="ev-q" placeholder="Поиск…">
      <select class="f-sel" id="ev-fs">
        <option value="">Все статусы</option>
        ${C.STATUS.event.map(s=>`<option value="${s}">${t('ev.status.'+s)||s}</option>`).join('')}
      </select>
    </div>
    <div id="ev-list">${evs.length?`<div class="ev-cards">${evs.map(ev=>renderEvCard(ev)).join('')}</div>`
    :'<div class="empty-s"><div class="empty-ico">🗂</div><div class="empty-txt">Нет мероприятий</div></div>'}</div>`;
  },
  init(){
    document.getElementById('ev-create-btn')?.addEventListener('click',()=>evForm(null));
    document.getElementById('ev-q')?.addEventListener('input',U.debounce(filterEvs,260));
    document.getElementById('ev-fs')?.addEventListener('change',filterEvs);
    bindEvCards();
  }
};

async function filterEvs(){
  const q=(document.getElementById('ev-q')?.value||'').toLowerCase();
  const st=document.getElementById('ev-fs')?.value||'';
  let evs=await EV.Data.list('events');
  if(q) evs=evs.filter(ev=>U.tx(ev.name).toLowerCase().includes(q));
  if(st) evs=evs.filter(ev=>ev.status===st);
  const el=document.getElementById('ev-list');
  if(!el) return;
  el.innerHTML=evs.length?`<div class="ev-cards">${evs.map(ev=>renderEvCard(ev)).join('')}</div>`
    :'<div class="empty-s"><div class="empty-ico">🗂</div><div class="empty-txt">Ничего не найдено</div></div>';
  bindEvCards();
}

function bindEvCards(){
  document.querySelectorAll('.ev-card[data-eid]').forEach(el=>{
    el.addEventListener('click',ev2=>{if(!ev2.target.closest('button'))showEvDetail(el.dataset.eid);});
  });
}

function renderEvCard(ev){
  const resp=S.dir.users?.[ev.responsibleId];
  const etLabel=(()=>{const et=EV.Data.settings().eventTypes.find(x=>x.id===ev.type);return et?U.tx(et):ev.type;})();
  const dLeft=ev.dateFrom?Math.ceil((U.parse(ev.dateFrom)-new Date())/86400000):null;
  return`<div class="ev-card" data-eid="${ev.id}">
    <div class="card-hd">
      <div class="card-ico" style="background:rgba(59,130,246,.15)">🗂</div>
      <div style="flex:1;min-width:0">
        <div class="card-ttl">${e(U.tx(ev.name))}</div>
        <div class="card-sub">${e(etLabel)}</div>
      </div>${stBd('event',ev.status)}
    </div>
    <div class="card-meta">
      <span class="card-stat">📅 ${U.fmtDate(ev.dateFrom)}–${U.fmtDate(ev.dateTo)}</span>
      <span class="card-stat">👥 ${ev.foreignGuests||0} иностр.</span>
      ${dLeft!==null&&dLeft>=0&&dLeft<=7?`<span class="badge bg-red">через ${dLeft}д</span>`:''}
    </div>
    ${ev.venue?`<div class="xs mu" style="margin-top:5px">📍 ${e(U.tx(ev.venue))}</div>`:''}
    ${resp?`<div class="xs mu" style="margin-top:3px">👤 ${e(resp.name)}</div>`:''}
    ${EV.Perm.can('event.status')?`<div class="card-acts">
      <button class="btn btn-xs btn-secondary" onclick="event.stopPropagation();showEvDetail('${ev.id}')">Подробно</button>
      <button class="btn btn-xs btn-secondary" onclick="event.stopPropagation();evForm('${ev.id}')">✏️</button>
      <button class="btn btn-xs btn-secondary" onclick="event.stopPropagation();S.evId='${ev.id}';document.getElementById('ev-sel').value='${ev.id}';go('dashboard')" title="Задать контекст">→</button>
    </div>`:''}
  </div>`;
}
window.showEvDetail=showEvDetail;

      <div class="f-grp"><label class="f-lbl">Название (EN)</label><input class="f-inp" name="name_en" value="${e(ev?.name?.en||'')}"></div>

    <div class="f-row s3">
      <div class="f-grp"><label class="f-lbl">Тип</label>

      <div class="f-grp"><label class="f-lbl">Окончание <span class="req">*</span></label><input class="f-inp" type="datetime-local" name="dateTo" value="${ev?.dateTo||''}" required></div>
    </div>
    <div class="f-row">
      <div class="f-grp"><label class="f-lbl">Площадка (RU)</label><input class="f-inp" name="venue_ru" value="${e(ev?.venue?U.tx(ev.venue):'')}" ></div>
      <div class="f-grp"><label class="f-lbl">Площадка (EN)</label><input class="f-inp" name="venue_en" value="${e(ev?.venue?.en||'')}"></div>
    </div>
    <div class="f-row s3">
      <div class="f-grp"><label class="f-lbl">Участников</label><input class="f-inp" type="number" name="participants" value="${ev?.participants||0}" min="0"></div>
      <div class="f-grp"><label class="f-lbl">Иностр. гостей</label><input class="f-inp" type="number" name="foreignGuests" value="${ev?.foreignGuests||0}" min="0"></div>
      <div class="f-grp"><label class="f-lbl">Ответственный</label>
        <select class="f-sel2" name="responsibleId">
          <option value="">— —</option>
          ${users.map(u=>`<option value="${u.id}" ${ev?.responsibleId===u.id?'selected':''}>${e(u.name)}</option>`).join('')}
        </select>
      </div>
    </div>
    <div class="f-row">
      <div class="f-grp"><label class="f-lbl">Контактное лицо</label><input class="f-inp" name="contactName" value="${e(ev?.contactName||'')}"></div>
      <div class="f-grp"><label class="f-lbl">Телефон</label><input class="f-inp" type="tel" name="contactPhone" value="${e(ev?.contactPhone||'')}"></div>
    </div>
    <div class="f-row s1">
      <div class="f-grp"><label class="f-lbl">Требования</label><textarea class="f-ta" name="req_ru">${e(ev?.requirements?U.tx(ev.requirements):'')}</textarea></div>
    </div>
    </form>`,
    footer:`<button class="btn btn-secondary" onclick="Modal.close()">Отмена</button><button class="btn btn-primary" id="ev-save-btn">${isNew?'Создать':'Сохранить'}</button>`
  });
  document.getElementById('ev-save-btn').addEventListener('click',async()=>{
    const form=document.getElementById('ev-form');
    if(!form.checkValidity()){form.reportValidity();return;}
    const fd=new FormData(form);
    const rec={name:{ru:fd.get('name_ru'),uz:fd.get('name_ru'),en:fd.get('name_en')||fd.get('name_ru')},type:fd.get('type'),
      dateFrom:fd.get('dateFrom'),dateTo:fd.get('dateTo'),
      venue:{ru:fd.get('venue_ru'),uz:fd.get('venue_ru'),en:fd.get('venue_en')||fd.get('venue_ru')},
      participants:+fd.get('participants'),foreignGuests:+fd.get('foreignGuests'),
      responsibleId:fd.get('responsibleId')||null,contactName:fd.get('contactName'),contactPhone:fd.get('contactPhone'),
      requirements:{ru:fd.get('req_ru'),uz:fd.get('req_ru'),en:fd.get('req_ru')}};
    try{
      if(isNew){rec.status='planned';await EV.Data.create('events',rec);Toast.ok('Создано');}
      else{await EV.Data.update('events',evId,rec);Toast.ok('Сохранено');}
      Modal.close();go('events');
    }catch(ex){Toast.err(ex.message||'Ошибка');}
  });
}

    </div></td>
  </tr>`;}).join('')}</tbody></table>`;

async function filterGuests(){
  const q=(document.getElementById('g-q')?.value||'').toLowerCase();
  const del=document.getElementById('g-del')?.value||'';
  const st=document.getElementById('g-st')?.value||'';
  const f=S.evId?{eventId:S.evId}:{};
  let [guests,dels]=await Promise.all([EV.Data.list('guests',f),EV.Data.list('delegations',f)]);
  const dm={};dels.forEach(d=>dm[d.id]=d);
  if(q) guests=guests.filter(g=>(g.fullName||'').toLowerCase().includes(q));

  if(st) guests=guests.filter(g=>g.status===st);
  document.getElementById('g-tbl-wrap').innerHTML=renderGTbl(guests,dm);
  bindGuestBtns();
}

function renderBkTbl(bks,gm){

  <tbody>${bks.map(bk=>{const g=gm[bk.guestId]||{},hotel=EV.Hotels.get(bk.hotelId);
  return`<tr>
    <td><div style="display:flex;align-items:center;gap:7px">${av(g.fullName||'?')}<div><div style="font-weight:600">${e(g.fullName||bk.guestId)}</div><div class="xs mu">${e(g.country||'')}</div></div></div></td>
    <td><div style="font-weight:600">${e(hotel?.name||bk.hotelId)}</div><div class="xs mu">${e(hotel?.region||'')}</div></td>
    <td>${bd(roomLbl(bk.roomType),'bg-blue')}</td>
    <td class="mono xs">${e(bk.roomNo||'—')}</td>
    <td class="sm">${U.fmtDate(bk.checkIn)}</td>
    <td class="sm">${U.fmtDate(bk.checkOut)}</td>
    <td class="sm">${U.nights(bk.checkIn,bk.checkOut)}</td>

    <td>${stBd('booking',bk.status)}</td>
    <td><div class="td-acts">
      <button class="btn btn-xs btn-secondary bkv-btn" data-bkid="${bk.id}">👁</button>
      ${EV.Perm.canEdit('booking')?`<button class="btn btn-xs btn-secondary bke-btn" data-bkid="${bk.id}">✏️</button>`:''}
    </div></td>
  </tr>`;}).join('')}</tbody></table>`;
}
async function filterBks(){
  const q=(document.getElementById('bk-q')?.value||'').toLowerCase();
  const st=document.getElementById('bk-st')?.value||'';
  const f=S.evId?{eventId:S.evId}:{};
  let [bks,guests]=await Promise.all([EV.Data.list('bookings',f),EV.Data.list('guests')]);
  const gm={};guests.forEach(g=>gm[g.id]=g);
  if(q) bks=bks.filter(b=>{const g=gm[b.guestId]||{},h=EV.Hotels.get(b.hotelId);return(g.fullName||'').toLowerCase().includes(q)||(h?.name||'').toLowerCase().includes(q);});
  if(st) bks=bks.filter(b=>b.status===st);
  document.getElementById('bk-tbl-wrap').innerHTML=renderBkTbl(bks,gm);
  bindBkBtns();
}
function bindBkBtns(){
  document.querySelectorAll('.bkv-btn').forEach(b=>b.addEventListener('click',()=>showBkDetail(b.dataset.bkid)));
  document.querySelectorAll('.bke-btn').forEach(b=>b.addEventListener('click',()=>bkEditStatus(b.dataset.bkid)));
}

MOD.tasks={
  async render(){
    const f=S.evId?{eventId:S.evId}:{};
    const [tasks,users]=await Promise.all([EV.Data.list('tasks',f),EV.Data.list('users')]);
    const um={};users.forEach(u=>um[u.id]=u);
    const now=new Date();
    const groups={new:[],in_progress:[],done:[],overdue:[]};
    tasks.forEach(tk=>{const ov=tk.status!=='done'&&tk.due&&U.parse(tk.due)<now;groups[ov?'overdue':tk.status]?.push(tk);});
    const rg=(label,arr,col)=>{
      if(!arr.length) return '';
      return`<div style="margin-bottom:18px">
        <div style="font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--${col});margin-bottom:7px">${label} (${arr.length})</div>
        <div style="display:flex;flex-direction:column;gap:7px">
        ${arr.map(tk=>{const u=um[tk.assigneeId]||{};const title=tk.title||t(tk.titleKey||'')||tk.id;
        return`<div style="display:flex;align-items:center;gap:9px;padding:9px 13px;background:var(--card);border:1px solid var(--border);border-left:3px solid var(--${col});border-radius:var(--r-sm)">
          <div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:600">${e(title)}</div>
          <div class="xs mu">${e(u.name||'')}${tk.due?' · '+U.fmtDTFull(tk.due):''}</div></div>
          ${prioBd(tk.priority)}
          ${EV.Perm.canEdit('tasks')?`<select class="f-sel" style="padding:3px 6px;font-size:11px;width:115px" onchange="upTk('${tk.id}',this.value)">
            ${C.STATUS.task.map(s=>`<option value="${s}" ${tk.status===s?'selected':''}>${t('tk.status.'+s)||s}</option>`).join('')}
          </select>`:stBd('task',tk.status)}
        </div>`;}).join('')}
        </div></div>`;
    };
    return`<div class="sec-head"><span class="sec-title">Задачи</span><div class="sec-acts"><span class="xs mu">${tasks.filter(t=>t.status!=='done').length} открытых</span></div></div>
    ${rg('Просрочено',groups.overdue,'red')||rg('Новые',groups.new,'accent')+rg('В работе',groups.in_progress,'amber')+rg('Выполнено',groups.done,'muted2')}
    ${!tasks.length?'<div class="empty-s"><div class="empty-ico">✅</div><div class="empty-txt">Нет задач</div></div>':''}`;
  },init(){}
};
window.upTk=async function(id,st){try{await EV.Data.update('tasks',id,{status:st});Toast.ok('Обновлено');go('tasks');}catch(ex){Toast.err(ex.message);}};

/* ── CALENDAR ────────────────────────────────────────────── */
MOD.calendar={
  _d:new Date(), _sel:null,
  async render(){
    const d=this._d; const yr=d.getFullYear(), mo=d.getMonth();
    const [evs,meets,deps,tasks]=await Promise.all([EV.Data.list('events'),EV.Data.list('meetings'),EV.Data.list('departures'),EV.Data.list('tasks')]);
    const byDay={};
    const add=(iso,lbl)=>{const day=U.day(iso);if(!day) return;(byDay[day]=byDay[day]||[]).push(lbl);};
    evs.forEach(ev=>{
      let cur=U.parse(ev.dateFrom);const end=U.parse(ev.dateTo);
      while(cur<=end){add(cur.toISOString(),`🗂 ${U.tx(ev.name)}`);cur=U.addDays(cur.toISOString(),1);}
    });
    meets.forEach(m=>add(m.at,'🛬 Встреча'));
    deps.forEach(d=>add(d.at,'🛫 Проводы'));
    tasks.filter(t=>t.due&&t.status!=='done').forEach(t=>add(t.due,'✅ Задача'));
    const first=new Date(yr,mo,1);
    const startDow=(first.getDay()+6)%7;
    const dim=new Date(yr,mo+1,0).getDate();
    const today=U.toDay(new Date());
    const mn=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
    const dows=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
    let cells='';
    for(let i=0;i<startDow;i++) cells+=`<div class="cal-day oth"></div>`;
    for(let day=1;day<=dim;day++){
      const iso=`${yr}-${String(mo+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
      const evts=byDay[iso]||[];
      cells+=`<div class="cal-day${iso===today?' today':''}${evts.length?' has-ev':''}" data-day="${iso}" title="${evts.join('\n')}">${day}</div>`;
    }
    const sel=this._sel, dayEvs=sel?(byDay[sel]||[]):[];
    return`<div class="sec-head"><span class="sec-title">Календарь</span></div>
    <div class="two-col">
      <div>
        <div class="cal-mini">
          <div class="cal-hdr">
            <button class="cal-nav-btn" id="cal-prev">‹</button>
            <span class="cal-mon">${mn[mo]} ${yr}</span>
            <button class="cal-nav-btn" id="cal-next">›</button>
          </div>
          <div class="cal-grid">
            ${dows.map(d=>`<div class="cal-dow">${d}</div>`).join('')}
            ${cells}
          </div>
        </div>
      </div>
      <div>
        ${sel?`<div class="sec-box">
          <div class="sec-box-hd"><span>📅</span><span class="sec-title">${sel}</span></div>
          <div class="sec-box-bd"><div class="act-list">${dayEvs.length?dayEvs.map(ev=>`<div class="act-item"><div class="act-dot"></div><div class="act-body"><div class="act-text">${e(ev)}</div></div></div>`).join('')
          :'<div class="empty-s" style="padding:14px"><div class="empty-txt">Нет событий</div></div>'}</div></div>
        </div>`:'<div class="empty-s"><div class="empty-ico">📅</div><div class="empty-txt">Кликните на дату</div></div>'}
      </div>
    </div>`;
  },
  init(){
    document.getElementById('cal-prev')?.addEventListener('click',()=>{this._d=new Date(this._d.getFullYear(),this._d.getMonth()-1,1);go('calendar');});
    document.getElementById('cal-next')?.addEventListener('click',()=>{this._d=new Date(this._d.getFullYear(),this._d.getMonth()+1,1);go('calendar');});
    document.querySelectorAll('.cal-day[data-day]').forEach(el=>el.addEventListener('click',()=>{this._sel=el.dataset.day;go('calendar');}));
  }
};

    <div class="tbl-wrap"><table class="ev-tbl"><thead><tr><th>Вид</th><th>Описание</th><th>Оценка</th><th>Дата</th></tr></thead>

/* ─── NOTIFICATIONS ───────────────────────────────────────── */
async function loadNotifs(){
  const notifs=await EV.Data.list('notifications');
  const unread=notifs.filter(n=>!(n.readBy||[]).includes(S.user.id));
  const dot=document.getElementById('n-dot');
  if(dot) dot.classList.toggle('hidden',!unread.length);
  const list=document.getElementById('notif-list');
  if(!list) return;
  if(!notifs.length){list.innerHTML='<div class="empty-s" style="padding:16px"><div class="empty-txt">Нет уведомлений</div></div>';return;}
  list.innerHTML=notifs.slice().reverse().slice(0,20).map(n=>{
    const read=(n.readBy||[]).includes(S.user.id);
    const txt=t(n.k,n.p)||n.k;
    return`<div class="n-item${!read?' unread':''}${n.priority==='high'?' hi':''}" data-nid="${n.id}">
      <div class="n-text">${e(txt)}</div>
      <div class="n-meta">${U.fmtDTFull(n.createdAt)}</div>
    </div>`;}).join('');
  list.querySelectorAll('.n-item').forEach(el=>el.addEventListener('click',async()=>{
    const n=notifs.find(x=>x.id===el.dataset.nid);
    if(n&&!(n.readBy||[]).includes(S.user.id)){
      await EV.Data.update('notifications',n.id,{readBy:[...(n.readBy||[]),S.user.id]},{system:true});
      loadNotifs();
    }
  }));
}

/* ─── INIT APP ────────────────────────────────────────────── */
function initApp(){
  EV.I18n.init();EV.Data.init();Modal.init();
  // Login
  document.getElementById('l-btn').addEventListener('click',doLogin);
  document.getElementById('l-pass').addEventListener('keydown',ev=>{if(ev.key==='Enter')doLogin();});
  document.querySelectorAll('.demo-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      document.getElementById('l-email').value=btn.dataset.e;
      document.getElementById('l-pass').value='demo';
      doLogin();
    });
  });
  if(EV.Auth.restore()){showApp();return;}
  document.getElementById('login-screen').classList.add('active');
}

function doLogin(){
  const email=document.getElementById('l-email').value.trim();
  const pw=document.getElementById('l-pass').value;
  const err=document.getElementById('l-err');
  if(EV.Auth.login(email,pw)){err.style.display='none';showApp();}
  else err.style.display='block';
}

async function showApp(){
  const u=S.user;
  document.getElementById('login-screen').classList.remove('active');
  document.getElementById('app-screen').classList.add('active');
  document.getElementById('u-name').textContent=u.name;
  document.getElementById('u-role').textContent=t('user.role.'+u.role)||u.role;
  const avEl=document.getElementById('u-av');
  avEl.textContent=U.initials(u.name); avEl.style.background=avColor(u.name);
  document.getElementById('logout-btn').addEventListener('click',()=>{
    EV.Auth.logout();
    document.getElementById('app-screen').classList.remove('active');
    document.getElementById('login-screen').classList.add('active');
  });
  // Mobile sidebar
  document.getElementById('menu-toggle').addEventListener('click',()=>{
    document.getElementById('sidebar').classList.toggle('mob');
    document.getElementById('sb-overlay').classList.toggle('open');
  });
  document.getElementById('sb-overlay').addEventListener('click',()=>{
    document.getElementById('sidebar').classList.remove('mob');
    document.getElementById('sb-overlay').classList.remove('open');
  });
  // Notifications
  document.getElementById('notif-btn').addEventListener('click',()=>document.getElementById('notif-panel').classList.toggle('open'));
  document.addEventListener('click',ev=>{if(!ev.target.closest('#notif-btn')&&!ev.target.closest('#notif-panel'))document.getElementById('notif-panel').classList.remove('open');});
  document.getElementById('mark-read-btn')?.addEventListener('click',async()=>{
    const ns=await EV.Data.list('notifications');
    for(const n of ns) if(!(n.readBy||[]).includes(u.id)) await EV.Data.update('notifications',n.id,{readBy:[...(n.readBy||[]),u.id]},{system:true});
    loadNotifs();
  });
  // Lang buttons
  document.querySelectorAll('.lang-btn').forEach(btn=>btn.addEventListener('click',()=>{
    EV.I18n.setLang(btn.dataset.lang);
    document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active',b===btn));
    if(S.mod) go(S.mod);
  }));
  // Event selector
  await loadEvSel();
  document.getElementById('ev-sel').addEventListener('change',async ev=>{
    S.evId=ev.target.value||null;
    if(S.mod) go(S.mod);
  });
  S.dir=EV.Data.directory();
  buildNav();loadNotifs();
  setInterval(()=>{S.dir=EV.Data.directory();buildNav();loadNotifs();},30000);
  EV.Bus.on('data',({entity})=>{
    if(entity==='notifications'){loadNotifs();return;}
    if(S.mod) go(S.mod);
    loadEvSel();buildNav();
  });
  const home=EV.Perm.home(u);
  go(home||'dashboard');
}

initApp();
})();
</script>
