<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">Продукт — SRI Toolkit</title>
  <meta name="description" id="page-desc" content="">
  <link rel="stylesheet" href="../design-tokens.css">
  <link rel="stylesheet" href="../styles/toolkit.css">
</head>
<body class="tk-page">

  <!-- HEADER -->
  <header class="tk-header">
    <div class="tk-container tk-header__inner">
      <a href="/tools/" class="tk-logo">
        <div class="tk-logo__icon">SRI</div>
        <div class="tk-logo__text">
          <span class="tk-logo__name">Toolkit</span>
          <span class="tk-logo__sub">by Silk Route Invest</span>
        </div>
      </a>
      <a href="/tools/" class="tk-nav__back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
        Все продукты
      </a>
    </div>
  </header>

  <!-- PAGE CONTENT — rendered by JS -->
  <div id="product-root"></div>

  <!-- STICKY MOBILE BAR -->
  <div class="tk-sticky-bar" id="sticky-bar">
    <span class="tk-sticky-bar__name" id="sticky-name"></span>
    <span class="tk-sticky-bar__price" id="sticky-price"></span>
    <button class="tk-btn tk-btn--buy tk-btn--sm" id="sticky-buy">Купить</button>
  </div>

  <!-- LIGHTBOX -->
  <div class="tk-lightbox" id="lightbox">
    <button class="tk-lightbox__close" id="lightbox-close">✕</button>
    <img class="tk-lightbox__img" id="lightbox-img" src="" alt="">
  </div>

  <!-- FOOTER -->
  <footer class="tk-footer">
    <div class="tk-container">
      <div class="tk-footer__inner">
        <div class="tk-footer__disclaimer">
          <strong>SRI Toolkit — коммерческий сервис</strong>
          Коммерческий сервис. Не является услугой Комитета по туризму Республики Узбекистан.<br>
          Продажи осуществляются через платформу Lemon Squeezy. © 2024 SRI Toolkit.
        </div>
        <div class="tk-footer__links">
          <a href="/tools/">Все продукты</a>
          <a href="/tools/bundles.html">Комплекты</a>
          <a href="/">Silk Route Invest</a>
        </div>
      </div>
    </div>
  </footer>

  <!-- Lemon Squeezy JS -->
  <script src="https://app.lemonsqueezy.com/js/lemon.js" defer></script>

  <script>
  (async () => {
    const params = new URLSearchParams(location.search);
    const slug = params.get('id');
    const root = document.getElementById('product-root');

    if (!slug) {
      root.innerHTML = '<div class="tk-container tk-section" style="text-align:center;"><p>Продукт не найден. <a href="/tools/">← Вернуться</a></p></div>';
      return;
    }

    let product;
    try {
      const resp = await fetch('../data/products.json');
      const all = await resp.json();
      product = all.find(p => p.slug === slug);
    } catch(e) {}

    if (!product) {
      root.innerHTML = '<div class="tk-container tk-section" style="text-align:center;"><p>Продукт не найден. <a href="/tools/">← Вернуться</a></p></div>';
      return;
    }

    // Update meta
    document.getElementById('page-title').textContent = `${product.name} — SRI Toolkit`;
    document.getElementById('page-desc').content = product.tagline;

    // Format badges
    const formatIcon = { 'Excel': '📊', 'PDF': '📄', 'PPTX': '📑', 'Word': '📝', 'Google Sheets': '📊', 'Interactive': '⚡' };
    const formatClass = { 'Excel': 'excel', 'PDF': 'pdf', 'PPTX': 'pptx', 'Word': 'word', 'Google Sheets': 'excel', 'Interactive': 'ai' };

    const formatBadges = (product.format || []).map(f =>
      `<span class="tk-format-badge tk-format-badge--${formatClass[f]||''}">${f}</span>`
    ).join('');

    const compareHtml = product.price_compare
      ? `<span class="tk-price__compare">$${product.price_compare}</span>` : '';

    const tierLabel = { starter:'Starter', essential:'Essential', professional:'Professional', enterprise:'Enterprise', tiered:'Несколько тарифов' };

    // Includes items with format icons
    const includesHtml = (product.includes || []).map(item => {
      let icon = '📄', iconClass = 'pdf';
      if (/excel|xlsx|sheets|калькулятор|дашборд|модел|прогноз|P&L|оценк/i.test(item)) { icon = '📊'; iconClass = 'excel'; }
      else if (/pptx|слайд|презентац/i.test(item)) { icon = '📑'; iconClass = 'pptx'; }
      else if (/word|шаблон|договор|документ/i.test(item)) { icon = '📝'; iconClass = 'word'; }
      else if (/промпт|ai|chat|claude/i.test(item)) { icon = '🤖'; iconClass = 'ai'; }
      else if (/видео|video/i.test(item)) { icon = '🎬'; iconClass = 'pdf'; }
      return `
        <div class="tk-include-item">
          <div class="tk-include-item__icon tk-include-item__icon--${iconClass}">${icon}</div>
          <span class="tk-include-item__text">${item}</span>
        </div>`;
    }).join('');

    // Gallery
    const galleryHtml = (product.preview_images || []).map(src => `
      <div class="tk-gallery__item" data-src="${src}">
        <div class="tk-app-frame">
          <div class="tk-app-frame__bar">
            <div class="tk-app-frame__dot"></div>
            <div class="tk-app-frame__dot"></div>
            <div class="tk-app-frame__dot"></div>
            <span class="tk-app-frame__title">${product.name}</span>
          </div>
          <img class="tk-gallery__img" src="${src}" alt="${product.name} превью" loading="lazy">
        </div>
      </div>`).join('');

    // For whom
    const forWhomHtml = (product.for_whom || []).map(fw => `
      <div class="tk-for-whom__item">
        <div class="tk-for-whom__role">${fw.role}</div>
        <p class="tk-for-whom__scenario">${fw.scenario}</p>
      </div>`).join('');

    // FAQ
    const faqHtml = (product.faq || []).map((item, i) => `
      <div class="tk-faq__item" id="faq-${i}">
        <button class="tk-faq__q" aria-expanded="false">
          ${item.q}
          <svg class="tk-faq__chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="tk-faq__a"><div class="tk-faq__a-inner">${item.a}</div></div>
      </div>`).join('');

    // Tiered pricing (P6)
    let pricingHtml = `
      <div class="tk-price">
        <span class="tk-price__current">$${product.price_usd}</span>
        ${compareHtml}
      </div>
      <p class="tk-price__note">Единоразовая оплата · Доступ навсегда</p>`;

    if (product.tier === 'tiered' && product.tiers) {
      pricingHtml = product.tiers.map(t => `
        <div style="padding:16px;border:1px solid var(${t.highlighted?'--tk-accent':'--color-border'});border-radius:6px;margin-bottom:8px;${t.highlighted?'background:var(--tk-accent-bg)':''}">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
            <strong style="font-size:15px;">${t.name}</strong>
            <span style="font-family:var(--font-mono);font-size:20px;font-weight:700;color:var(--tk-accent);">$${t.price}</span>
          </div>
          <ul style="list-style:none;padding:0;margin:0 0 12px;display:flex;flex-direction:column;gap:4px;">
            ${t.includes.map(i => `<li style="font-size:12px;color:var(--color-text-muted);display:flex;gap:6px;"><span style="color:var(--tk-accent);font-weight:700;">✓</span>${i}</li>`).join('')}
          </ul>
          <a href="${t.checkout_url}" class="tk-btn tk-btn--${t.highlighted?'buy':'outline'} tk-btn--sm lemonsqueezy-button" style="width:100%;justify-content:center;">
            ${t.highlighted ? '✦ Выбрать' : 'Выбрать'}
          </a>
        </div>`).join('');
    }

    // Render related bundle CTA
    const bundleNames = { starter: '"Старт" ($79)', investor: '"Инвестор" ($199)' };
    const bundleCTA = product.bundle_mention ? `
      <div style="padding:24px 28px;background:var(--color-surface);border:var(--border-hairline);border-radius:8px;margin-top:32px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;">
        <div>
          <div style="font-size:11px;text-transform:uppercase;letter-spacing:0.1em;color:var(--color-text-muted);margin-bottom:4px;">Часто покупают вместе</div>
          <div style="font-size:15px;font-weight:600;">Комплект ${bundleNames[product.bundle_mention]}</div>
        </div>
        <a href="/tools/bundles.html" class="tk-btn tk-btn--outline tk-btn--sm">Смотреть комплект →</a>
      </div>` : '';

    // Main render
    root.innerHTML = `
      <!-- HERO -->
      <section class="tk-product-hero">
        <div class="tk-container">
          <div class="tk-product-hero__inner">
            <div>
              <div class="tk-product-hero__eyebrow">
                <span class="tk-tier-badge tk-tier-badge--${product.tier}">${tierLabel[product.tier]||product.tier}</span>
                <span style="font-size:12px;color:var(--color-text-muted);">${product.category_label}</span>
              </div>
              <h1 class="tk-product-hero__title">${product.name}</h1>
              <p class="tk-product-hero__tagline">${product.tagline}</p>
              <p style="font-size:14px;color:var(--color-text-muted);line-height:1.65;margin:0 0 32px;max-width:500px;">${product.description}</p>

              ${product.tier !== 'tiered' ? `
              <div class="tk-product-hero__buy-block">
                <div>
                  <div class="tk-price">
                    <span class="tk-price__current">$${product.price_usd}</span>
                    ${compareHtml}
                  </div>
                  <p class="tk-price__note">Единоразовая оплата · Доступ навсегда</p>
                </div>
                <a href="${product.checkout_url}" class="tk-btn tk-btn--buy tk-btn--lg lemonsqueezy-button" id="main-buy-btn">
                  Купить · $${product.price_usd}
                </a>
              </div>
              <div class="tk-product-hero__meta">
                <span>📁 ${product.file_count} файл${product.file_count>4?'ов':product.file_count>1?'а':''}</span>
                <span>${formatBadges}</span>
                <span>🔒 Безопасная оплата</span>
              </div>
              ` : ''}
            </div>

            <!-- PREVIEW PANEL / PRICING PANEL -->
            <div class="tk-preview-panel">
              ${product.preview_images?.[0] ? `
              <img class="tk-preview-panel__img" src="${product.preview_images[0]}" alt="${product.name}">
              ` : ''}
              <div class="tk-preview-panel__body">
                ${pricingHtml}
                ${product.tier !== 'tiered' ? `
                <a href="${product.checkout_url}" class="tk-btn tk-btn--buy tk-preview-panel__btn lemonsqueezy-button" style="margin-top:16px;">
                  Купить · $${product.price_usd}
                </a>
                ` : ''}
                <!-- Placeholder for local payments (Payme/Click/Uzum) — Phase 2 -->
                <div class="tk-preview-panel__local">
                  🇺🇿 Оплата через Payme/Click — скоро
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- INCLUDES -->
      <section class="tk-section">
        <div class="tk-container">
          <p class="tk-section-label">Состав набора</p>
          <h2 class="tk-section-title">Что входит в продукт</h2>
          <p class="tk-section-desc">Каждый файл решает конкретную задачу. Никаких заглушек и шаблонных текстов.</p>
          <div class="tk-includes-grid">${includesHtml}</div>
        </div>
      </section>

      <!-- GALLERY -->
      ${galleryHtml ? `
      <section class="tk-section" style="padding-top:0;">
        <div class="tk-container">
          <p class="tk-section-label">Превью</p>
          <h2 class="tk-section-title">Как выглядит внутри</h2>
          <div class="tk-gallery">${galleryHtml}</div>
        </div>
      </section>` : ''}

      <!-- FOR WHOM -->
      ${forWhomHtml ? `
      <section class="tk-section" style="padding-top:0;">
        <div class="tk-container">
          <p class="tk-section-label">Целевая аудитория</p>
          <h2 class="tk-section-title">Для кого этот продукт</h2>
          <div class="tk-for-whom">${forWhomHtml}</div>
        </div>
      </section>` : ''}

      <!-- FAQ -->
      ${faqHtml ? `
      <section class="tk-section" style="padding-top:0;">
        <div class="tk-container">
          <p class="tk-section-label">FAQ</p>
          <h2 class="tk-section-title">Частые вопросы</h2>
          <div class="tk-faq" style="margin-top:32px;">${faqHtml}</div>
          ${bundleCTA}
        </div>
      </section>` : ''}

      <!-- REPEAT BUY -->
      ${product.tier !== 'tiered' ? `
      <section class="tk-section" style="padding-top:0;padding-bottom:80px;">
        <div class="tk-container">
          <div style="background:var(--color-card-bg);border:var(--border-hairline);border-radius:8px;padding:40px 48px;display:flex;align-items:center;justify-content:space-between;gap:32px;flex-wrap:wrap;">
            <div>
              <h3 style="font-family:var(--font-display);font-size:22px;margin:0 0 8px;">${product.name}</h3>
              <p style="font-size:14px;color:var(--color-text-muted);margin:0;">${product.tagline}</p>
            </div>
            <div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap;">
              <div class="tk-price">
                <span class="tk-price__current">$${product.price_usd}</span>
                ${compareHtml}
              </div>
              <a href="${product.checkout_url}" class="tk-btn tk-btn--buy tk-btn--lg lemonsqueezy-button">
                Купить сейчас
              </a>
            </div>
          </div>
        </div>
      </section>` : ''}
    `;

    // Sticky bar setup
    const stickyName = document.getElementById('sticky-name');
    const stickyPrice = document.getElementById('sticky-price');
    const stickyBuy = document.getElementById('sticky-buy');
    if (stickyName) stickyName.textContent = product.name;
    if (stickyPrice) stickyPrice.textContent = `$${product.price_usd}`;
    if (stickyBuy) stickyBuy.onclick = () => window.open(product.checkout_url, '_blank');

    // FAQ accordion
    document.querySelectorAll('.tk-faq__q').forEach(btn => {
      btn.addEventListener('click', () => {
        const item = btn.closest('.tk-faq__item');
        const isOpen = item.classList.contains('is-open');
        document.querySelectorAll('.tk-faq__item').forEach(i => i.classList.remove('is-open'));
        if (!isOpen) item.classList.add('is-open');
        btn.setAttribute('aria-expanded', !isOpen);
      });
    });

    // Gallery lightbox
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    document.querySelectorAll('.tk-gallery__item').forEach(item => {
      item.addEventListener('click', () => {
        lightboxImg.src = item.dataset.src;
        lightbox.classList.add('is-open');
      });
    });
    document.getElementById('lightbox-close').addEventListener('click', () => {
      lightbox.classList.remove('is-open');
    });
    lightbox.addEventListener('click', e => {
      if (e.target === lightbox) lightbox.classList.remove('is-open');
    });

    // Sticky bar on mobile: show after scrolling past hero
    if (window.innerWidth <= 768) {
      const bar = document.getElementById('sticky-bar');
      const hero = root.querySelector('.tk-product-hero');
      if (bar && hero) {
        const observer = new IntersectionObserver(entries => {
          bar.style.display = entries[0].isIntersecting ? 'none' : 'flex';
        }, { threshold: 0.1 });
        observer.observe(hero);
      }
    }

    // Init Lemon Squeezy overlay (if their script is loaded)
    if (window.createLemonSqueezy) window.createLemonSqueezy();
  })();
  </script>
</body>
</html>
